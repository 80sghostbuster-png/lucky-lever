<html lang="en">

<title>Lucky Lever — Play-Money Slots</title>

<meta name="theme-color" content="#000000">

<style>
:root{--cream:#f6efd9;--red:#ee3b24;--orange:#f58220;--yellow:#fdc82f;--cyan:#1fb5e6;--blue:#2456d6;--green:#7ac143;
  --font:"Arial Black","Helvetica Neue",Impact,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:var(--font);color:var(--cream)}
body{position:fixed;inset:0}
button{font-family:inherit;color:inherit;cursor:pointer;margin:0;padding:0;outline:none;-webkit-appearance:none;appearance:none;touch-action:manipulation}
button:focus-visible{box-shadow:0 0 0 3px var(--cyan)!important}
canvas{display:block}

#stage{position:absolute;left:0;top:0;transform-origin:0 0;visibility:hidden}
#stage.ready{visibility:visible}
#stage>*{position:absolute}

/* ---------- chrome machine ---------- */
#machine{border-radius:34px;
  background:
   linear-gradient(180deg,rgba(255,255,255,.75) 0,rgba(255,255,255,0) 7%,rgba(255,255,255,0) 90%,rgba(0,0,0,.45) 100%),
   linear-gradient(90deg,#6a727b 0%,#eef2f6 6%,#aab2bb 18%,#fafcfe 34%,#a2abb5 52%,#eef2f6 74%,#8b939c 90%,#5d646c 100%);
  box-shadow:inset 0 0 0 3px #2c3036,inset 0 0 0 6px rgba(255,255,255,.55),inset 0 -10px 18px rgba(0,0,0,.35),
   0 0 0 2px #000,0 0 50px rgba(255,255,255,.07),0 24px 60px rgba(0,0,0,.9)}
#machine>*{position:absolute}
#marquee{border-radius:16px}
#winframe{border-radius:22px;background:linear-gradient(180deg,#14171a,#050607);
  box-shadow:inset 0 0 0 3px #3b4047,inset 0 0 0 5px #0a0b0c,0 0 0 3px rgba(255,255,255,.65),0 2px 0 4px rgba(0,0,0,.45)}
#reels{position:absolute;left:10px;top:10px;border-radius:12px;touch-action:none}
#displays{display:flex;gap:8px;border-radius:14px}
.disp{flex:1 1 0;min-width:0;background:linear-gradient(180deg,#050505,#15110f);border-radius:10px;
  box-shadow:inset 0 0 0 2px #2a2d31,inset 0 3px 8px #000,0 0 0 2px rgba(255,255,255,.55);padding:4px 8px 5px;display:flex;flex-direction:column}
.disp.credit{flex:2.3}.disp.bet{flex:.95}.disp.win{flex:1.7}

.disp canvas{flex:1 1 auto;width:100%;min-height:0}

.btn{position:relative;background:linear-gradient(180deg,#1b1b1b,#070707);border:3px solid var(--cream);border-radius:16px;
  box-shadow:0 5px 0 #6d6650,0 8px 14px rgba(0,0,0,.7);transition:transform .06s,box-shadow .06s,filter .15s;overflow:hidden}
.btn:active,.btn.press{transform:translateY(4px);box-shadow:0 1px 0 #6d6650,0 2px 6px rgba(0,0,0,.7)}
.btn.sel{background:linear-gradient(180deg,#ffd75a,#f58220);border-color:#fff7dc;box-shadow:0 5px 0 #9a4d0a,0 0 22px rgba(253,200,47,.55)}
.btn.sel:active{box-shadow:0 1px 0 #9a4d0a,0 0 22px rgba(253,200,47,.55)}
.btn.cant{filter:grayscale(.8) brightness(.55)}
.btn canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.btn::before{content:"";position:absolute;left:0;right:0;top:0;height:7px;pointer-events:none;opacity:.9;
  background:linear-gradient(180deg,var(--red) 0 2px,var(--orange) 2px 4px,var(--yellow) 4px 6px,transparent 6px)}
.btn.sel::before{opacity:.0}
#bets{display:grid;gap:8px}
#spin{border-radius:22px;background:linear-gradient(180deg,#ff5a3c 0,#e3311d 48%,#a5160e 100%);border-color:var(--cream);
  box-shadow:0 7px 0 #5e0b06,0 10px 22px rgba(238,59,36,.35)}
#spin:active,#spin.press{transform:translateY(6px);box-shadow:0 1px 0 #5e0b06,0 2px 8px rgba(238,59,36,.35)}

#utils{display:flex;gap:8px}
.u{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;
  letter-spacing:.08em;font-weight:900;line-height:1.05;text-align:center;border-radius:14px}
.u svg{width:26px;height:26px;fill:none;stroke:var(--cream);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.u .us{font-size:12px;color:var(--yellow)}
.u.on{border-color:var(--yellow)}
.u.on .us{color:#fff}
.u.glow{animation:glow 1.1s ease-in-out infinite;border-color:var(--yellow)}
@keyframes glow{50%{box-shadow:0 5px 0 #6d6650,0 0 22px 4px rgba(253,200,47,.8)}}
#caption{font-size:10px;white-space:nowrap;letter-spacing:.14em;color:#6c6753;text-align:center;font-weight:900}
#hint{display:none;text-align:center;font-size:15px;letter-spacing:.14em;color:var(--cream);font-weight:900;line-height:28px}

body.pad #utils,body.pad #bets,body.pad #spin,body.pad #caption{display:none!important}

.port #bets{left:12px;top:722px;width:426px;height:84px;grid-template-columns:repeat(4,1fr)}

.land #winframe{left:27px;top:114px;width:386px;height:254px}
.land #reels{width:366px;height:234px}

/* ---------- overlay panels (real px, scrollable) ---------- */
#fx{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:20}
#overlay{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;padding:max(10px,env(safe-area-inset-top)) 10px 10px}
#overlay.show{display:flex}
#card{position:relative;width:min(640px,100%);max-height:100%;overflow:auto;-webkit-overflow-scrolling:touch;background:#0a0a0a;

.note{margin-top:14px;padding:12px 14px;border:2px solid var(--yellow);border-radius:14px;color:var(--yellow)!important;font-weight:800!important;font-size:15px!important;text-align:center}
.pbtn{display:block;width:100%;min-height:60px;margin-top:14px;border-radius:16px;border:3px solid var(--cream);background:linear-gradient(180deg,#ffd75a,#f58220);
  color:#1a0f00;font-size:18px;letter-spacing:.06em;box-shadow:0 5px 0 #9a4d0a}
.pbtn:active{transform:translateY(4px);box-shadow:0 1px 0 #9a4d0a}
.pbtn.dim{background:#161616;color:var(--cream);box-shadow:0 5px 0 #4a4535;font-size:14px;min-height:52px}
#toast{position:fixed;left:50%;top:max(14px,env(safe-area-inset-top));transform:translate(-50%,-30px);z-index:40;padding:10px 18px;border-radius:14px;
  background:#111;border:2px solid var(--yellow);color:var(--yellow);font-size:14px;letter-spacing:.08em;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;text-align:center;max-width:92vw}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-height:480px){#card{padding:10px 14px 14px}#card h2{font-size:20px;line-height:46px}#closeX{width:46px;height:46px}}

<div id="stage" class="port">

</div>

<script>
"use strict";
/*ENGINE_START*/
// ======================================================================
//  LUCKY LEVER — game math (also loaded by the node RTP simulator)
//  Play money only. One centre payline, 3 weighted reels (64 stops each).
// ======================================================================
const SYMS = ['CHERRY','LEMON','BELL','DIAMOND','BAR','SEVEN','WILD'];
const NSTOPS = 64;
// Stops per reel strip (must add up to 64). Same weights on all three reels.
const WEIGHTS = { CHERRY:20, LEMON:16, BELL:12, DIAMOND:7, BAR:4, SEVEN:3, WILD:2 };
// Paytable — multiplier of the bet. WILD substitutes for anything and counts as a cherry.
const PAY = {
  WILD:250,      // 3 x WILD
  SEVEN:100,     // 3 x red 7   (wilds can complete it)
  BAR:50,        // 3 x BAR
  DIAMOND:25,    // 3 x diamond
  BELL:12,       // 3 x bell
  LEMON:10,      // 3 x lemon
  CHERRY:5,      // 3 x cherry
  CHERRY2:1      // any 2 cherries (wild counts) — money back
};
const BET_STEPS = [1,5,10,25];
const BIG_LEVELS = [ {min:100,name:'JACKPOT'}, {min:50,name:'MEGA WIN'}, {min:25,name:'BIG WIN'} ];

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function buildStrip(seed){
  const r = mulberry32(seed), a = [];
  for (const s of SYMS) for (let i=0;i<WEIGHTS[s];i++) a.push(s);
  for (let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  for (let pass=0;pass<40;pass++){            // break up neighbouring duplicates (cosmetic only)
    let ok=true;
    for (let i=0;i<a.length;i++){ const n=(i+1)%a.length;
      if (a[i]===a[n]){ ok=false; const j=Math.floor(r()*a.length); [a[n],a[j]]=[a[j],a[n]]; } }
    if (ok) break;
  }
  return a;
}
const STRIPS = [buildStrip(1013), buildStrip(2027), buildStrip(3041)];

// Evaluate the centre line [s0,s1,s2] -> {mult, kind, cells:[bool,bool,bool]}
function evaluate(line){
  let best = { mult:0, kind:'none', cells:[false,false,false] };
  if (line.every(s=>s==='WILD')) best = { mult:PAY.WILD, kind:'WILD', cells:[true,true,true] };
  for (const s of SYMS){
    if (s==='WILD') continue;
    if (line.every(x=>x===s||x==='WILD') && PAY[s]>best.mult) best = { mult:PAY[s], kind:s, cells:[true,true,true] };
  }
  const ch = line.map(x=>x==='CHERRY'||x==='WILD');
  if (ch.filter(Boolean).length>=2 && PAY.CHERRY2>best.mult) best = { mult:PAY.CHERRY2, kind:'CHERRY2', cells:ch };
  return best;
}
// One spin: pick a uniform stop on every reel, read the centre symbol.
function spinOutcome(rng){
  const stops = [0,1,2].map(()=>Math.min(NSTOPS-1,Math.floor(rng()*NSTOPS)));
  const line = stops.map((s,i)=>STRIPS[i][s]);
  return Object.assign({ stops, line }, evaluate(line));
}
// Exact return-to-player by enumerating every symbol combination weighted by its probability.
function theoretical(){
  let rtp=0, hit=0;
  for (const a of SYMS) for (const b of SYMS) for (const c of SYMS){
    const p = WEIGHTS[a]*WEIGHTS[b]*WEIGHTS[c]/Math.pow(NSTOPS,3);
    const m = evaluate([a,b,c]).mult; rtp += p*m; if (m>0) hit += p;
  }
  return { rtp, hit };
}
/*ENGINE_END*/

// ======================================================================
//  State + persistence (localStorage)
// ======================================================================
const LS_KEY = 'luckyLever.v1';
const START_COINS = 1000, DAILY_BONUS = 250, RESCUE_COINS = 100;
const G = { balance:START_COINS, bet:5, muted:false, lastBonus:'',
  stats:{ spins:0, wagered:0, won:0, wins:0, biggest:0, bestMult:0 } };
function loadState(){
  try{
    const o = JSON.parse(localStorage.getItem(LS_KEY)||'null');
    if (o && typeof o==='object'){
      if (Number.isFinite(o.balance)) G.balance = Math.max(0,Math.floor(o.balance));
      if (BET_STEPS.includes(o.bet)) G.bet = o.bet;
      G.muted = !!o.muted; G.lastBonus = o.lastBonus||'';
      if (o.stats) for (const k in G.stats) if (Number.isFinite(o.stats[k])) G.stats[k]=o.stats[k];
    }
  }catch(e){}
}
function saveState(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(G)); }catch(e){} }
loadState();
const todayKey = ()=>{ const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); };
const fmt = n => Math.floor(n).toLocaleString('en-US');
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const $ = id => document.getElementById(id);
const rng = (()=>{ const c=window.crypto; if (c&&c.getRandomValues){ const b=new Uint32Array(1); return ()=>{c.getRandomValues(b);return b[0]/4294967296;}; } return Math.random; })();

// ======================================================================
//  Pixel type (5x7 bitmap font, drawn in code — no font files)
// ======================================================================
const FONT_SRC = {
 A:'01110,10001,10001,11111,10001,10001,10001',B:'11110,10001,10001,11110,10001,10001,11110',
 C:'01110,10001,10000,10000,10000,10001,01110',D:'11110,10001,10001,10001,10001,10001,11110',
 E:'11111,10000,10000,11110,10000,10000,11111',F:'11111,10000,10000,11110,10000,10000,10000',
 G:'01110,10001,10000,10111,10001,10001,01111',H:'10001,10001,10001,11111,10001,10001,10001',
 I:'01110,00100,00100,00100,00100,00100,01110',J:'00111,00010,00010,00010,00010,10010,01100',
 K:'10001,10010,10100,11000,10100,10010,10001',L:'10000,10000,10000,10000,10000,10000,11111',
 M:'10001,11011,10101,10101,10001,10001,10001',N:'10001,11001,10101,10011,10001,10001,10001',
 O:'01110,10001,10001,10001,10001,10001,01110',P:'11110,10001,10001,11110,10000,10000,10000',
 Q:'01110,10001,10001,10001,10101,10010,01101',R:'11110,10001,10001,11110,10100,10010,10001',
 S:'01111,10000,10000,01110,00001,00001,11110',T:'11111,00100,00100,00100,00100,00100,00100',
 U:'10001,10001,10001,10001,10001,10001,01110',V:'10001,10001,10001,10001,10001,01010,00100',
 W:'10001,10001,10001,10101,10101,11011,10001',X:'10001,10001,01010,00100,01010,10001,10001',
 Y:'10001,10001,01010,00100,00100,00100,00100',Z:'11111,00001,00010,00100,01000,10000,11111',
 0:'01110,10001,10011,10101,11001,10001,01110',1:'00100,01100,00100,00100,00100,00100,01110',
 2:'01110,10001,00001,00010,00100,01000,11111',3:'11110,00001,00001,01110,00001,00001,11110',
 4:'00010,00110,01010,10010,11111,00010,00010',5:'11111,10000,11110,00001,00001,10001,01110',
 6:'00110,01000,10000,11110,10001,10001,01110',7:'11111,00001,00010,00100,01000,01000,01000',
 8:'01110,10001,10001,01110,10001,10001,01110',9:'01110,10001,10001,01111,00001,00010,01100',

const Snd = (()=>{

      const comp=ctx.createDynamicsCompressor(); master.connect(comp); comp.connect(ctx.destination);
      noiseBuf=ctx.createBuffer(1,ctx.sampleRate*0.5,ctx.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;

  function setMuted(m){ if (master) master.gain.setTargetAtTime(m?0:0.7,ctx.currentTime,0.02); }

    click(){ tone(900,0.04,'square',0.06); noise(0.02,0.15,2500,'highpass'); },

const SEG = {'0':'abcdef','1':'bc','2':'abdeg','3':'abcdg','4':'bcfg','5':'acdfg','6':'acdefg','7':'abc','8':'abcdefg','9':'abcdfg','-':'g',' ':''};
function drawLED(cv,text,n,color,dim){

  const total=n*dw+(n-1)*gap, x0=(W-total)/2, y0=(H-dh)/2+th*0.1;

  ctx.save(); ctx.translate(0,0);

    const x=x0+i*(dw+gap), lit=SEG[s[i]]||'', g=th*0.62;

    const v=(a,b,xx)=>[[xx,a],[xx+th/2,a+th/2],[xx+th/2,b-th/2],[xx,b],[xx-th/2,b-th/2],[xx-th/2,a+th/2]];

      f:v(y0+g,my-g*0.2,x+th/2), b:v(y0+g,my-g*0.2,x+dw-th/2), e:v(my+g*0.2,y0+dh-g,x+th/2), c:v(my+g*0.2,y0+dh-g,x+dw-th/2) };
    for(const k in segs){ const on=lit.indexOf(k)>=0; const p=segs[k];

}

const disp = { balance:G.balance, win:0 };

const AUTO_STEPS=[10,25,50];

  if(v>G.balance&&G.balance>=1){ Snd.nope(); toast('NOT ENOUGH COINS FOR '+v); return; }
  G.bet=v; if(!silent) Snd.bet(); saveState(); redrawStatic();
}
function stepBet(d){
  if(phase==='spinning'||panel) return;
  let i=BET_STEPS.indexOf(G.bet)+d; i=clamp(i,0,BET_STEPS.length-1); if(BET_STEPS[i]===G.bet) return;
  if(BET_STEPS[i]>G.balance){ Snd.nope(); toast('NOT ENOUGH COINS'); return; } setBet(BET_STEPS[i]);
}
function triggerSpin(){ if(phase==='spinning') slamStop(); else startSpin(); }

let forced=null;
function startSpin(){
  if(panel||phase==='spinning') return false;
  if(phase==='result') endCelebration();
  if(G.balance<1){ openPanel('rescue'); return false; }
  if(G.bet>G.balance){ G.bet=affordableBet(); toast('BET LOWERED TO '+G.bet); }
  Snd.unlock(); Snd.lever(); vibrate(18);
  let out=spinOutcome(rng);
  if(forced){ const line=forced; forced=null; const stops=line.map((s,i)=>Math.max(0,STRIPS[i].indexOf(s))); out=Object.assign({stops,line:stops.map((s,i)=>STRIPS[i][s])},evaluate(stops.map((s,i)=>STRIPS[i][s]))); }
  const bet=G.bet, win=bet*out.mult;
  G.balance-=bet; G.balance+=win;                 // stored balance already includes the result
  const st=G.stats; st.spins++; st.wagered+=bet; if(win>0){ st.won+=win; st.wins++; } if(win>st.biggest) st.biggest=win; if(out.mult>st.bestMult) st.bestMult=out.mult;
  saveState();
  disp.balance=G.balance-win; disp.win=0; balAnim=null;
  spinState.out=out; spinState.win=win; spinState.t=0; spinState.running=true; phase='spinning';
  const s0=out.line[0], s1=out.line[1];
  const tease=(s0===s1||s0==='WILD'||s1==='WILD')&&['SEVEN','BAR','DIAMOND','WILD'].includes(s0==='WILD'?s1:s0);
  reels.forEach((R,i)=>{ R.mode='run'; R.v=0; R.target=out.stops[i]; R.stopAt=0.85+i*0.42+(i===2&&tease?0.85:0); R.ticks=Math.floor(R.pos); });
  redrawStatic(); refreshLEDs(); return true;
}
function slamStop(){
  if(!spinState.running||spinState.t<0.35) return;
  let n=0; reels.forEach(R=>{ if(R.mode==='run'){ R.stopAt=Math.min(R.stopAt,spinState.t+n*0.16); n++; } });
}
function updateReels(dt){
  if(spinState.running) spinState.t+=dt;
  for(const R of reels){
    const before=R.pos;
    if(R.mode==='run'){
      R.v=Math.min(VMAX,R.v+95*dt); R.pos+=R.v*dt;
      if(spinState.t>=R.stopAt&&(R.i===0||reels[R.i-1].mode!=='run')){
        const f=R.pos-Math.floor(R.pos); R.p0=R.target-7+f; R.pos=R.p0; R.D=(7-f)+0.17; R.T=3*R.D/R.v; R.t=0; R.mode='brake'; R.ticks=Math.floor(R.pos);

    } else if(R.mode==='settle'){

    const inst=dt>0?Math.abs(R.pos-before)/dt:0; R.vis+=(inst-R.vis)*Math.min(1,dt*30); if(R.mode==='stopped'||R.mode==='settle') R.vis*=0.5;

function finishSpin(){
  spinState.running=false; const out=spinState.out, win=spinState.win;
  if(win>0) startCelebration(out,win); else { phase='idle'; afterRound(); }
}
function startCelebration(out,win){
  phase='result'; let level=0; let name=null;
  for(const L of BIG_LEVELS) if(out.mult>=L.min){ name=L.name; level=L.name==='JACKPOT'?3:L.name==='MEGA WIN'?2:1; break; }
  const dur=0.7+Math.min(3.2,Math.log2(1+out.mult)*0.45);
  celeb={ active:true, win, mult:out.mult, level, name, dur, t:0, linger:level?1.7:0.55, cells:out.cells, coinT:0, lastShown:0 };
  marq.flash=1; if(name){ marq.banner=name; marq.bannerT=0; marq.bannerAmt=0; }
  Snd.win(level); vibrate(level?[40,40,40,40,80]:[30]); padRumble(level);
  showerCoins(level===3?260:level===2?170:level===1?110:out.mult>=5?36:12, Math.min(dur+0.8,4));
}
function updateCelebration(dt){
  if(!celeb||!celeb.active) return; const c=celeb; c.t+=dt;
  const u=Math.min(1,c.t/c.dur), shown=Math.floor(c.win*easeOutCubic(u)+(u>=1?c.win:0)); const s=u>=1?c.win:Math.min(c.win,shown);
  disp.win=s; disp.balance=G.balance-c.win+s; if(marq.banner) marq.bannerAmt=s;
  if(s!==c.lastShown){ c.coinT-=dt; if(c.coinT<=0){ Snd.coin(); c.coinT=0.065; } c.lastShown=s; }
  if(c.t>=c.dur+c.linger) endCelebration();
}
function endCelebration(){
  if(!celeb||!celeb.active) { phase=phase==='result'?'idle':phase; return; }
  const c=celeb; c.active=false; disp.win=c.win; disp.balance=G.balance; marq.flash=0; marq.banner=null; phase='idle'; afterRound();
}
function afterRound(){
  disp.balance=G.balance; refreshLEDs();
  if(G.balance<1){ autoLeft=0; updateUtils(); setTimeout(()=>{ if(phase==='idle'&&!panel&&G.balance<1) openPanel('rescue'); },700); return; }
  if(G.bet>G.balance){ G.bet=affordableBet(); saveState(); }
  if(autoLeft>0&&G.bet>G.balance) autoLeft=0;
  redrawStatic(); autoTimer=0;
}
function updateAuto(dt){
  if(autoLeft<=0||phase!=='idle'||panel||lever.mode==='auto'){ autoTimer=0; return; }
  autoTimer+=dt; if(autoTimer>0.55){ autoTimer=0; autoLeft--; updateUtils(); leverAuto(startSpin); }
}
function cycleAuto(){
  if(panel) return; Snd.click();
  if(autoLeft>0){ autoLeft=0; } else autoLeft=AUTO_STEPS[0];
  updateUtils();
}
function cycleAutoStep(){ // long-press / second tap while idle cycles the count
  const i=AUTO_STEPS.indexOf(autoLeft); autoLeft=AUTO_STEPS[(i+1)%AUTO_STEPS.length]; updateUtils();
}

// ---- bonus / rescue ----
function bonusReady(){ return G.lastBonus!==todayKey(); }
function animateBalance(from,to,dur){ balAnim={from,to,dur,t:0}; }
function giveCoins(n,msg){
  const from=G.balance; G.balance+=n; saveState(); disp.balance=from; animateBalance(from,G.balance,1.0);
  showerCoins(Math.min(90,20+n/5),1.2); Snd.bonus(); toast(msg); vibrate([30,30,30]); updateUtils();
}
function claimBonus(){
  if(phase==='spinning'||phase==='result'&&celeb&&celeb.active) { toast('WAIT FOR THE SPIN TO FINISH'); return; }
  if(!bonusReady()){ Snd.nope(); toast('DAILY BONUS CLAIMED — COME BACK TOMORROW'); return; }
  G.lastBonus=todayKey(); giveCoins(DAILY_BONUS,'DAILY BONUS +'+DAILY_BONUS+' COINS!');
}
function claimRescue(){ closePanel(); giveCoins(RESCUE_COINS,'FREE REFILL +'+RESCUE_COINS+' COINS'); G.bet=affordableBet(); saveState(); redrawStatic(); }

// ======================================================================
//  UI: labels, utils, panels
// ======================================================================
function drawLabel(cv,text,o){
  const ctx=cv._ctx; if(!ctx) return; const W=cv._w,H=cv._h; ctx.clearRect(0,0,W,H);
  const u=Math.min(H*(o.h||0.46)/7,(W*(o.w||0.7))/pxWidth(text,1)), w=pxWidth(text,u);
  drawPx(ctx,text,(W-w)/2,(H-7*u)/2+(o.dy||0),u,o.style);
}
function redrawStatic(){
  document.querySelectorAll('#bets .btn').forEach(b=>{
    const v=+b.dataset.bet, sel=v===G.bet; b.classList.toggle('sel',sel); b.classList.toggle('cant',v>G.balance&&G.balance>=1);
    drawLabel(b.firstElementChild,String(v),{h:view.mode==='land'?0.4:0.46,dy:3,style:sel?{fill:'#1a0f00',shadow:[0,0,'transparent']}:{fill:CREAM,shadow:[1.6,2.2,'#ee3b24']}});
  });
  const busy=phase==='spinning';
  $('spin').classList.toggle('busy',busy);
  const txt=busy?'STOP':'SPIN';
  drawLabel(spinLbl,txt,{h:view.mode==='land'?0.26:0.44,w:0.72,dy:5,style:{fill:CREAM,stroke:'#5e0b06',strokeW:3.4,shadow:[2.2,3,'#5e0b06']}});
  refreshLEDs(true); updateUtils();
}
function updateUtils(){
  $('autoSub').textContent=autoLeft>0?autoLeft+' LEFT':'OFF'; $('btnAuto').classList.toggle('on',autoLeft>0);
  const ready=bonusReady(); $('bonusSub').textContent=ready?'+'+DAILY_BONUS+' FREE':'TOMORROW'; $('btnBonus').classList.toggle('glow',ready);
  $('sndX').style.display=G.muted?'':'none'; $('sndWaves').style.display=G.muted?'none':''; $('sndLbl').textContent=G.muted?'MUTED':'SOUND'; $('btnSound').classList.toggle('on',!G.muted);
}
function toggleMute(){ G.muted=!G.muted; saveState(); Snd.unlock(); Snd.setMuted(G.muted); updateUtils(); if(!G.muted) Snd.bet(); }

function closeIcon(){ return '<button id="closeX" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></svg></button>'; }
function buildPay(){
  const th=theoretical(), rows=[['WILD','WILD','WILD',PAY.WILD,'WILD'],['SEVEN','SEVEN','SEVEN',PAY.SEVEN,'SEVEN'],['BAR','BAR','BAR',PAY.BAR,'BAR'],['DIAMOND','DIAMOND','DIAMOND',PAY.DIAMOND,'DIAMOND'],
    ['BELL','BELL','BELL',PAY.BELL,'BELL'],['LEMON','LEMON','LEMON',PAY.LEMON,'LEMON'],['CHERRY','CHERRY','CHERRY',PAY.CHERRY,'CHERRY'],['CHERRY','CHERRY',null,PAY.CHERRY2,null]];
  let h=closeIcon()+'<h2>PAYTABLE</h2><p>Pays on the centre line. Win = bet × multiplier. Bet now: <b style="color:#fdc82f">'+G.bet+'</b></p><table class="pt">';
  rows.forEach(r=>{ h+='<tr><td><div class="syms">'+r.slice(0,3).map(s=>'<canvas data-s="'+(s||'ANY')+'" width="92" height="92"></canvas>').join('')+'</div></td><td class="mult">×'+r[3]+'</td><td class="pay">'+fmt(r[3]*G.bet)+' coins</td><td class="wt">'+(r[4]?WEIGHTS[r[4]]+'/64 per reel':'any wilds count')+'</td></tr>'; });
  h+='</table><h3>RULES</h3><ul><li><b>WILD</b> substitutes for every symbol and counts as a cherry. Three wilds pay the top prize.</li><li>Any 2 cherries (wilds count) pay <b>×'+PAY.CHERRY2+'</b> — your bet back.</li><li>Only the highest win on the line is paid.</li></ul>'+
    '<h3>REEL ODDS</h3><p>Each reel has '+NSTOPS+' stops: '+SYMS.slice().reverse().map(s=>s+' '+WEIGHTS[s]).join(' · ')+'.</p>'+
    '<p>Theoretical return to player: <b style="color:#fdc82f">'+(th.rtp*100).toFixed(2)+'%</b> · hit frequency '+(th.hit*100).toFixed(1)+'%.</p><div class="note">Play money only. No real-money prizes.</div>';
  return h;
}
function buildInfo(){
  const s=G.stats, ret=s.wagered?(s.won/s.wagered*100).toFixed(1)+'%':'—', wr=s.spins?(s.wins/s.spins*100).toFixed(1)+'%':'—';
  return closeIcon()+'<h2>INFO</h2><h3>HOW TO PLAY</h3><ul><li><b>Pull the lever</b> (drag it down or tap it) or press <b>SPIN</b>. Pick a bet of 1, 5, 10 or 25.</li>'+
  '<li>Press SPIN while the reels turn to stop them faster.</li><li><b>AUTO</b> spins for you (10 spins; stops when you run low).</li><li>Daily bonus: <b>+'+DAILY_BONUS+'</b> free coins once a day. If you hit zero you can always take a free <b>+'+RESCUE_COINS+'</b> refill.</li></ul>'+
  '<h3>CONTROLS</h3><ul><li><b>Keyboard:</b> Space / Enter = spin · ↑ ↓ = bet · A = auto · M = sound · P = paytable · I = info</li><li><b>Gamepad:</b> Cross (✕) = spin · D-pad ↑↓ = bet · Square = auto · Triangle = paytable · Options = info · Circle = close. On-screen buttons hide while a gamepad is connected.</li></ul>'+
  '<h3>YOUR STATS (SAVED ON THIS DEVICE)</h3><div class="stats"><div>Spins<b>'+fmt(s.spins)+'</b></div><div>Wins<b>'+fmt(s.wins)+' ('+wr+')</b></div><div>Wagered<b>'+fmt(s.wagered)+'</b></div><div>Paid out<b>'+fmt(s.won)+'</b></div><div>Return<b>'+ret+'</b></div><div>Biggest win<b>'+fmt(s.biggest)+'</b></div><div>Best multiplier<b>×'+s.bestMult+'</b></div><div>Balance<b>'+fmt(G.balance)+'</b></div></div>'+
  '<div class="note">Play money only. No real-money prizes.</div><p style="text-align:center;margin-top:10px">Virtual coins have no cash value and cannot be bought, sold or redeemed. Nothing here is gambling. Take breaks and have fun.</p>'+
  '<button class="pbtn dim" id="resetBtn">RESET COINS &amp; STATS</button>';
}
function buildRescue(){
  return '<h2 style="text-align:center">OUT OF COINS!</h2><p style="text-align:center;font-size:16px">No worries — it\'s play money. Here\'s a free refill so you can keep spinning.</p><button class="pbtn" id="rescueBtn">TAKE '+RESCUE_COINS+' FREE COINS</button><div class="note">Play money only. No real-money prizes.</div>';
}
function openPanel(kind){
  if(phase==='spinning') return;
  if(kind!=='rescue'&&panel&&panel.kind==='rescue') return;
  if(phase==='result') endCelebration();
  panel={kind}; const card=$('card'); card.innerHTML=kind==='pay'?buildPay():kind==='info'?buildInfo():buildRescue(); card.scrollTop=0;
  $('overlay').classList.add('show'); Snd.click();
  card.querySelectorAll('canvas[data-s]').forEach(cv=>{ const s=cv.dataset.s, x=cv.getContext('2d');
    if(s==='ANY'){ x.fillStyle='#8c846c'; x.font='900 56px system-ui,sans-serif'; x.textAlign='center'; x.textBaseline='middle'; x.fillText('?',46,50); } else drawSymbol(x,s,46,47,80); });
  const cx=$('closeX'); if(cx) cx.onclick=closePanel;
  const rb=$('rescueBtn'); if(rb) rb.onclick=claimRescue;
  const rs=$('resetBtn'); if(rs) rs.onclick=()=>{ if(rs.dataset.armed){ localStorage.removeItem(LS_KEY); Object.assign(G,{balance:START_COINS,bet:5,lastBonus:'',stats:{spins:0,wagered:0,won:0,wins:0,biggest:0,bestMult:0}}); disp.balance=G.balance; disp.win=0; saveState(); closePanel(); redrawStatic(); toast('FRESH START: '+START_COINS+' COINS'); } else { rs.dataset.armed=1; rs.textContent='TAP AGAIN TO CONFIRM'; setTimeout(()=>{ if(rs&&rs.isConnected){ delete rs.dataset.armed; rs.innerHTML='RESET COINS &amp; STATS'; } },3000); } };
}
function closePanel(){ if(!panel) return; const wasRescue=panel.kind==='rescue'; panel=null; $('overlay').classList.remove('show'); Snd.click(); if(wasRescue&&G.balance<1){ /* stay broke until they take it */ } }
function panelPrimary(){ if(!panel) return; if(panel.kind==='rescue') claimRescue(); else closePanel(); }
$('overlay').addEventListener('pointerdown',e=>{ if(e.target.id==='overlay'&&panel&&panel.kind!=='rescue') closePanel(); });

document.querySelectorAll('#bets .btn').forEach(b=>b.addEventListener('click',()=>{ Snd.unlock(); if(panel) return; setBet(+b.dataset.bet); b.blur(); }));
$('spin').addEventListener('click',()=>{ Snd.unlock(); requestSpin(); $('spin').blur(); });
$('btnAuto').addEventListener('click',e=>{ Snd.unlock(); if(autoLeft>0) { autoLeft=0; updateUtils(); Snd.click(); } else { cycleAuto(); } e.currentTarget.blur(); });
$('btnBonus').addEventListener('click',e=>{ Snd.unlock(); if(panel) return; claimBonus(); e.currentTarget.blur(); });
$('btnSound').addEventListener('click',e=>{ toggleMute(); e.currentTarget.blur(); });
$('btnPay').addEventListener('click',e=>{ Snd.unlock(); panel&&panel.kind==='pay'?closePanel():openPanel('pay'); e.currentTarget.blur(); });
$('btnInfo').addEventListener('click',e=>{ Snd.unlock(); panel&&panel.kind==='info'?closePanel():openPanel('info'); e.currentTarget.blur(); });
['pointerdown','touchstart','keydown'].forEach(ev=>window.addEventListener(ev,()=>Snd.unlock(),{passive:true}));
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('contextmenu',e=>e.preventDefault());

window.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey) return; const k=e.key;
  if(panel){ if(k==='Escape'||k==='Enter'||k===' '){ e.preventDefault(); if(k==='Escape'&&panel.kind==='rescue') return; panelPrimary(); } return; }
  if(k===' '||k==='Enter'){ e.preventDefault(); if(!e.repeat) requestSpin(); }
  else if(k==='ArrowUp'){ e.preventDefault(); stepBet(1); } else if(k==='ArrowDown'){ e.preventDefault(); stepBet(-1); }
  else if(k==='a'||k==='A') cycleAuto(); else if(k==='m'||k==='M') toggleMute();
  else if(k==='p'||k==='P') openPanel('pay'); else if(k==='i'||k==='I') openPanel('info'); else if(k==='b'||k==='B') claimBonus();
});

// ======================================================================
//  Gamepad (PlayStation pads use the "standard" mapping: Cross=0, Circle=1, Square=2, Triangle=3)
// ======================================================================
const pad={ connected:false, prev:{}, axisY:0 };
function setPadMode(on){ if(on===padMode) return; padMode=on; document.body.classList.toggle('pad',on); layout(); if(on) toast('GAMEPAD CONNECTED'); }
window.addEventListener('gamepadconnected',()=>setPadMode(true));
window.addEventListener('gamepaddisconnected',()=>{ setTimeout(()=>{ const any=[...(navigator.getGamepads?navigator.getGamepads():[])].some(p=>p&&p.connected); if(!any) setPadMode(false); },50); });
function padRumble(level){ try{ const p=[...navigator.getGamepads()].find(p=>p&&p.connected); if(p&&p.vibrationActuator&&!G.muted) p.vibrationActuator.playEffect('dual-rumble',{duration:level?500:150,strongMagnitude:level?0.8:0.3,weakMagnitude:level?0.6:0.2}); }catch(e){} }
function pollPad(){
  if(!navigator.getGamepads) return; const ps=navigator.getGamepads(); let p=null; for(const q of ps) if(q&&q.connected){ p=q; break; }
  if(!p){ pad.prev={}; return; }
  if(!padMode) setPadMode(true);
  const btn=i=>!!(p.buttons[i]&&(p.buttons[i].pressed||p.buttons[i].value>0.6)), edge=i=>{ const n=btn(i),was=pad.prev[i]; pad.prev[i]=n; return n&&!was; };
  const ay=p.axes[1]||0, up=ay<-0.6, dn=ay>0.6, wasUp=pad.prev.au, wasDn=pad.prev.ad; pad.prev.au=up; pad.prev.ad=dn;
  const eX=edge(0), eO=edge(1), eSq=edge(2), eTri=edge(3), eUp=edge(12), eDn=edge(13), eOpt=edge(9), eShare=edge(8);
  if(eX){ Snd.unlock(); requestSpin(); }
  if(eO&&panel&&panel.kind!=='rescue') closePanel();
  if(eUp||(up&&!wasUp)) stepBet(1); if(eDn||(dn&&!wasDn)) stepBet(-1);
  if(eSq) cycleAuto(); if(eTri) (panel&&panel.kind==='pay')?closePanel():openPanel('pay');
  if(eOpt) (panel&&panel.kind==='info')?closePanel():openPanel('info'); if(eShare) claimBonus();
}

// ======================================================================
//  Main loop
// ======================================================================
let last=performance.now(), lastBusy=false;
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now; const t=now/1000;
  pollPad(); if((phase==='spinning')!==lastBusy){ lastBusy=phase==='spinning'; redrawStatic(); } updateReels(dt); updateLever(dt); updateCelebration(dt); updateAuto(dt); updateCoins(dt);
  if(balAnim){ balAnim.t+=dt; const u=Math.min(1,balAnim.t/balAnim.dur); disp.balance=balAnim.from+(balAnim.to-balAnim.from)*easeOutCubic(u); if(u>=1){ disp.balance=G.balance; balAnim=null; } }
  if(marq.banner) marq.bannerT+=dt;
  drawMarquee(t); drawReels(t); drawLever(); refreshLEDs(); drawCoins();
  requestAnimationFrame(frame);
}
let rzT; const onResize=()=>{ clearTimeout(rzT); rzT=setTimeout(layout,60); };
window.addEventListener('resize',onResize); window.addEventListener('orientationchange',()=>setTimeout(layout,250));
if(window.visualViewport) window.visualViewport.addEventListener('resize',onResize);
layout(); disp.balance=G.balance; refreshLEDs(true); requestAnimationFrame(frame);
if(G.balance<1) setTimeout(()=>openPanel('rescue'),500);
// Test / debug hook (no UI): force the next spin's centre line, e.g. __slots.force(['SEVEN','SEVEN','WILD'])
window.__slots={ G, force:l=>{forced=l;}, get phase(){return phase;}, spin:requestSpin, evaluate, theoretical, setPad:setPadMode };
</script>
